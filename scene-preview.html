<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오갱 · 단계별 화면 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f0f2f5;font-family:Bahnschrift,'Malgun Gothic',sans-serif}header{padding:18px 24px;border-bottom:1px solid #343047}h1{font-size:19px;margin:0 0 8px}p{font-size:11px;color:#b7bfce;margin:0;line-height:1.8}nav{display:flex;gap:8px;padding:15px 24px;flex-wrap:wrap}button{padding:11px 15px;background:#232431;border:1px solid #525364;color:#ddd;font:12px 'Malgun Gothic';cursor:pointer}button.active{color:#001e19;background:#00e5ca;border-color:#00e5ca}iframe{display:block;width:100%;height:calc(100dvh - 175px);min-height:700px;border:0;background:#090b10}.meta{display:flex;gap:18px;align-items:center;padding:0 24px 12px;font-size:11px;color:#c4b7d3}.meta a{color:#00e5ca}@media(max-width:720px){header{padding:15px}nav{padding:12px 15px;gap:6px}button{font-size:10px;padding:9px 10px}.meta{padding-inline:15px}iframe{height:800px;min-height:650px}}</style></head><body><header><h1>ARCADE GANG / 단계별 화면 미리보기</h1><p>샘플 결과로 각 화면과 연출을 바로 확인합니다. 실제 진행 중인 경기 기록에는 영향을 주지 않습니다.</p></header><nav id="scenes"><button data-scene="opening">첫 오프닝</button><button data-scene="overview" class="active">① 전체 트리</button><button data-scene="compact">② 3개 조 남음</button><button data-scene="qualifier">③ 진출 결정전</button><button data-scene="qualifier-award">④ FINALIST 연출</button><button data-scene="round-opening">라운드 오프닝</button><button data-scene="final-opening">결승 오프닝</button><button data-scene="final">⑤ 최종 결승 대기</button><button data-scene="champion-award">⑥ CHAMPION 연출</button><button data-scene="champion">⑦ 우승 확정 화면</button></nav><div class="meta"><span>관중용 화면 기준 · 연출은 탭을 다시 누르면 재생됩니다.</span><a id="separate" href="live.html?display=1&amp;preview=overview" target="_blank">선택 화면 크게 열기 ↗</a><a href="live.html" target="_blank">실제 경기 운영 화면 ↗</a></div><iframe id="screen" title="오갱 단계별 관중용 화면" allow="fullscreen" src="live.html?display=1&amp;preview=overview"></iframe><script>document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-scene]').forEach(x=>x.classList.toggle('active',x===b));const url='live.html?display=1&preview='+b.dataset.scene;document.querySelector('#screen').src=url;document.querySelector('#separate').href=url;});</script></body></html>
